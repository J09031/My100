<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>My100 RCPA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#3E1F63;
    --ink-2:#5C3B87;
    --paper:#F8F4FB;
    --surface:#FFFFFF;
    --line:#E4D6F0;
    --text:#241733;
    --muted:#7A6690;
    --accent:#9966CC;
    --accent-2:#B98FDC;
    --good:#3F7D5C;
    --good-bg:#E7F0EA;
    --warn:#B4562C;
    --warn-bg:#FBEAE0;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(45,20,70,0.08), 0 8px 24px -12px rgba(45,20,70,0.20);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .display{ font-family: Georgia, "Times New Roman", serif; letter-spacing:-0.01em; }

  .storage-banner{
    background:var(--warn-bg); color:var(--warn); font-size:13px; font-weight:600;
    padding:10px 22px; text-align:center; border-bottom:1px solid #E7C7B4; position:sticky; top:0; z-index:25;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; background:var(--ink); color:#F3ECFA;
    box-shadow: var(--shadow);
    position:sticky; top:0; z-index:20;
    flex-wrap:wrap; gap:10px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{
    font-family: Georgia, serif; font-weight:700; font-size:20px;
    background:var(--accent); color:#fff; padding:3px 9px; border-radius:6px;
    letter-spacing:0.02em;
  }
  .crest-badge{
    width:42px; height:42px; border-radius:50%; overflow:hidden; flex-shrink:0;
    border:2px solid #D4AF37; background:#0a0a0a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 0 0 1px rgba(212,175,55,0.3);
    display:flex; align-items:center; justify-content:center;
  }
  .crest-badge img{ width:100%; height:100%; object-fit:cover; }
  .crest-hero{
    width:64px; height:64px; border-radius:14px; overflow:hidden; flex-shrink:0;
    border:2px solid #D4AF37; background:#0a0a0a;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3), 0 0 0 1px rgba(212,175,55,0.25);
    display:flex; align-items:center; justify-content:center;
  }
  .crest-hero img{ width:100%; height:100%; object-fit:contain; padding:6px; box-sizing:border-box; }
  .brand .sub{ font-size:12.5px; color:#D8C9EA; letter-spacing:0.02em;}
  .who{ display:flex; align-items:center; gap:12px; font-size:13.5px;}
  .who .role-chip{
    background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:20px; font-size:12px;
    border:1px solid rgba(255,255,255,0.18);
  }
  .btn{
    font:inherit; cursor:pointer; border:none; border-radius:8px; padding:9px 16px;
    font-size:13.5px; font-weight:600; transition:transform .08s ease, filter .12s ease;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; color:#F3ECFA; border:1px solid rgba(255,255,255,0.3); }
  .btn-ghost:hover{ background:rgba(255,255,255,0.08); }
  .btn-outline{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn-outline:hover{ background:#EFE3F7; }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }
  .btn-danger{ background:#9C3D52; color:#fff; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* ---------- login ---------- */
  .login-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px;}
  .login-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:40px 36px; width:100%; max-width:460px; box-shadow:var(--shadow);
  }
  .login-title{ font-family:Georgia,serif; font-size:28px; margin:0 0 4px; color:var(--ink);}
  .login-sub{ color:var(--muted); font-size:14px; margin:0 0 26px; line-height:1.5;}
  .role-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:22px;}
  .role-card{
    border:1.5px solid var(--line); border-radius:10px; padding:14px 8px; text-align:center;
    cursor:pointer; background:#FAF6FD; transition:all .12s ease;
  }
  .role-card:hover{ border-color:var(--accent); }
  .role-card.active{ border-color:var(--accent); background:var(--good-bg); box-shadow:0 0 0 3px rgba(217,113,60,0.12);}
  .role-card .r-icon{ font-size:22px; display:block; margin-bottom:6px;}
  .role-card .r-label{ font-size:12.5px; font-weight:600; color:var(--ink);}
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:5px;}
  .field select, .field input{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14px; background:#fff; color:var(--text);
  }
  .field select:focus, .field input:focus{ outline:none; border-color:var(--accent); }
  .login-err{ background:var(--warn-bg); color:var(--warn); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:14px; display:none;}

  /* ---------- layout ---------- */
  .main{ flex:1; padding:22px; max-width:1400px; margin:0 auto; width:100%; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
  .panel-pad{ padding:20px 22px; }
  .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .row-between{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  h2.section-title{ font-family:Georgia,serif; font-size:21px; margin:0; color:var(--ink);}
  .muted{ color:var(--muted); font-size:13px; }
  .tabs{ display:flex; gap:6px; margin:18px 0; border-bottom:1.5px solid var(--line); }
  .tab{ padding:9px 16px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1.5px;}
  .tab.active{ color:var(--ink); border-bottom-color:var(--accent); }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:16px 0 20px;}
  .stat{ background:#FAF6FD; border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .stat .num{ font-family:Georgia,serif; font-size:26px; color:var(--ink); }
  .stat .lbl{ font-size:12px; color:var(--muted); margin-top:2px;}

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0; }
  .toolbar input[type=text], .toolbar select, .toolbar input[type=month]{
    padding:8px 11px; border:1.5px solid var(--line); border-radius:8px; font-size:13.5px; background:#fff;
  }
  .search-box{ flex:1; min-width:180px; }

  table{ border-collapse:collapse; width:100%; font-size:13px; }
  thead th{
    position:sticky; top:0; background:#EFE3F7; color:var(--ink); text-align:left;
    padding:9px 10px; font-weight:700; font-size:12px; border-bottom:1.5px solid var(--line); white-space:nowrap;
  }
  tbody td{ padding:8px 10px; border-bottom:1px solid #EDE1F5; white-space:nowrap; }
  tbody tr:hover{ background:#FAF5FC; }
  .table-scroll{ overflow:auto; max-height:65vh; border:1px solid var(--line); border-radius:10px; }
  .status-chip{ font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; }
  .status-done{ background:var(--good-bg); color:var(--good); }
  .status-pending{ background:var(--warn-bg); color:var(--warn); }
  .num-cell{ text-align:right; font-variant-numeric:tabular-nums; }
  th.num-header{ text-align:right; }
  .sticky-col-1{ position:sticky; left:0; z-index:6; min-width:44px; max-width:56px; }
  .sticky-col-2{ position:sticky; left:56px; z-index:6; min-width:150px; box-shadow: 2px 0 4px -2px rgba(0,0,0,0.15); }
  thead th.sticky-col-1, thead th.sticky-col-2{ background:#EFE3F7; z-index:7; }
  tbody td.sticky-col-1, tbody td.sticky-col-2{ background:var(--surface); }
  tbody tr:hover td.sticky-col-1, tbody tr:hover td.sticky-col-2{ background:#FAF5FC; }

  /* ---------- drawer / modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(35,15,55,0.45); display:none;
    align-items:stretch; justify-content:flex-end; z-index:50;
  }
  .overlay.open{ display:flex; }
  .drawer{
    background:var(--surface); width:min(560px,100%); height:100%; overflow-y:auto;
    box-shadow:-8px 0 30px rgba(0,0,0,0.15); padding:26px 26px 100px;
    animation:slideIn .18s ease;
  }
  @keyframes slideIn{ from{ transform:translateX(24px); opacity:0;} to{ transform:translateX(0); opacity:1;} }
  .drawer-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;}
  .drawer-head h3{ font-family:Georgia,serif; font-size:22px; margin:0; color:var(--ink);}
  .close-x{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); line-height:1;}
  .drawer-sub{ color:var(--muted); font-size:13px; margin:2px 0 20px; }
  .fgroup{ margin-bottom:22px; }
  .fgroup h4{ font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent); margin:0 0 10px; font-weight:700;}
  .fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .fitem label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .fitem input, .fitem textarea{
    width:100%; padding:8px 10px; border:1.5px solid var(--line); border-radius:7px; font-size:13.5px; font-family:inherit;
  }
  .fitem input:focus, .fitem textarea:focus{ outline:none; border-color:var(--accent); }
  .drawer-footer{
    position:sticky; bottom:-100px; margin:0 -26px -100px; padding:16px 26px; background:var(--surface);
    border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end;
  }
  .drawer-actions-fixed{
    position:fixed; bottom:0; right:0; width:min(560px,100%); background:var(--surface);
    border-top:1px solid var(--line); padding:14px 26px; display:flex; gap:10px; justify-content:space-between; align-items:center;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.08);
  }

  .empty{ text-align:center; padding:50px 20px; color:var(--muted); }
  .empty .big{ font-size:34px; margin-bottom:10px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#F8F4FB; padding:11px 20px; border-radius:30px; font-size:13.5px;
    box-shadow:var(--shadow); z-index:100; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  .upload-box{
    border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center; background:#FAF6FD;
  }
  .upload-box.drag{ border-color:var(--accent); background:var(--good-bg); }

  .confirm-overlay{ position:fixed; inset:0; background:rgba(35,15,55,0.5); display:none; align-items:center; justify-content:center; z-index:80;}
  .confirm-overlay.open{ display:flex; }
  .confirm-box{ background:#fff; border-radius:14px; padding:26px 26px; width:min(420px,92%); box-shadow:var(--shadow); }
  .confirm-box h3{ margin:0 0 8px; font-family:Georgia,serif; color:var(--ink);}
  .confirm-box p{ margin:0 0 20px; color:var(--muted); font-size:14px; line-height:1.5;}

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#D9C7EC; border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:720px){
    .fgrid{ grid-template-columns:1fr; }
    .role-grid{ grid-template-columns:1fr; }
    .main{ padding:14px; }
    .login-card{ padding:28px 20px; }
  }

  @media print{
    .topbar, .tabs, .toolbar, #refreshLiveBtn, #printDashBtn, #printReportBtn, #printReviewBtn,
    #exportBtn, #syncSheetBtn, .storage-banner, .toast, .btn{ display:none !important; }
    body{ background:#fff; }
    .main{ padding:0; max-width:100%; }
    .panel{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; page-break-inside:avoid; margin-bottom:14px !important; }
    .table-scroll{ max-height:none !important; overflow:visible !important; border:none; }
    table{ font-size:10px; }
    thead th{ position:static; }
    .sticky-col-1, .sticky-col-2{ position:static !important; box-shadow:none !important; }
    canvas{ max-width:100% !important; }
    .stat-grid{ break-inside:avoid; }
    h2.section-title{ margin-top:6px; }
    .row-between{ display:block; }
    .row-between select, .row-between input, .row-between label{ display:none !important; }
  }
</style>
</head>

/* ---- Visit date (DD,DD,... or NVD) helpers ---- */
function normalizeVisitInput(raw){
  if(raw==null) return { valid:false, value:'' };
  const s = String(raw).trim();
  if(!s) return { valid:false, value:'' };
  if(s.toUpperCase()==='NVD') return { valid:true, value:'NVD' };
  const parts = s.split(',').map(p=>p.trim()).filter(Boolean);
  if(!parts.length) return { valid:false, value:s };
  const days = [];
  for(const p of parts){
    if(!/^\d{1,2}$/.test(p)) return { valid:false, value:s };
    const n = parseInt(p,10);
    if(n<1 || n>31) return { valid:false, value:s };
    days.push(String(n).padStart(2,'0'));
  }
  return { valid:true, value: days.join(',') };
}

function monthLabel(m){
  const [y,mo] = m.split('-');
  const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[parseInt(mo,10)-1] + ' ' + y;
}
function lastNMonths(n){
  const out=[];
  const d = new Date();
  for(let i=0;i<n;i++){
    out.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
    d.setMonth(d.getMonth()-1);
  }
  return out;
}
function mstr(y,m){ return y + '-' + String(m).padStart(2,'0'); }
// Indian financial year runs Apr -> Mar. Returns FY groups covering last FY, current FY, and next FY
// so months are always available regardless of which month it is "today".
function fyMonthGroups(){
  const now = new Date();
  const curCalYear = now.getFullYear();
  // FY start year is the calendar year in which April falls for the current FY
  const curFyStart = (now.getMonth()+1) >= 4 ? curCalYear : curCalYear - 1;
  const groups = [];
  [curFyStart-1, curFyStart, curFyStart+1].forEach(startYear=>{
    const label = 'FY ' + startYear + '-' + String(startYear+1).slice(-2);
    const months = [];
    for(let m=4;m<=12;m++) months.push(mstr(startYear,m));
    for(let m=1;m<=3;m++) months.push(mstr(startYear+1,m));
    groups.push({ label, months });
  });
  return groups;
}
function monthSelectHtml(id, selected){
  const groups = fyMonthGroups();
  return `<select id="${id}">${groups.map(g=>
    `<optgroup label="${g.label}">${g.months.map(m=>
      `<option value="${m}" ${m===selected?'selected':''}>${monthLabel(m)}</option>`
    ).join('')}</optgroup>`
  ).join('')}</select>`;
}

/* ============ STORAGE (Google Apps Script Web App + Sheet backend) ============ */
async function storageGet(key, shared){
  try{
    const url = APPS_SCRIPT_URL + '?key=' + encodeURIComponent(key) + '&token=' + encodeURIComponent(APPS_SCRIPT_SECRET);
    const res = await fetch(url);
    state.connectionOK = res.ok;
    if(!res.ok) return null;
    const data = await res.json();
    if(data.error){ console.error('storageGet error:', data.error); return null; }
    state.lastSyncedAt = new Date();
    return (data.value === undefined || data.value === '') ? null : data.value;
  }catch(e){
    state.connectionOK = false;
    console.error('storageGet failed', e);
    return null;
  }
}

async function storageSet(key, value, shared){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      // Content-Type must stay text/plain — a JSON content-type triggers a CORS
      // preflight that Apps Script Web Apps don't handle, and the request silently fails.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key, value, token: APPS_SCRIPT_SECRET }),
    });
    state.connectionOK = res.ok;
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    state.lastSyncedAt = new Date();
    return true;
  }catch(e){
    console.error('storageSet failed', e);
    if(typeof showToast === 'function'){
      showToast('⚠ Save failed — could not reach the shared storage backend. Check your internet connection and try again.');
    }
    return false;
  }
}

/* ============ MONTH-WISE SHEET MIRROR (readable tab per month, e.g. "July-26") ============ */
function monthToSheetTabName(m){
  const [y, mo] = m.split('-');
  const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return names[parseInt(mo,10)-1] + '-' + y.slice(-2);
}

function buildSheetRowArray(doc, entry, hasData, month){
  const groupTotals = {};
  PRODUCT_GROUPS.forEach(g=>{ groupTotals[g.key] = hasData ? computeGroupTotal(entry, g) : 0; });
  const totalSupport = hasData ? computeTotalSupport(entry) : 0;
  const patMonth = hasData ? computePatMonth(entry) : '';
  const e = entry || {};
  const sheetMonth = monthToSheetTabName(month);

  const row = [
    doc.sr, doc.rm, doc.am, doc.me, doc.code, doc.doctor, doc.specialty, doc.location,
    (e.practice || normalizePractice(doc.practice) || doc.practice),
    e.patDay!=null ? e.patDay : '', e.pracDay!=null ? e.pracDay : '', patMonth,
  ];
  PRODUCT_GROUPS.forEach(g=>{
    g.items.forEach(it=> row.push(e[it.id]!=null ? e[it.id] : ''));
    row.push(hasData ? Number(groupTotals[g.key].toFixed(2)) : '');
  });
  row.push(hasData ? Number(totalSupport.toFixed(2)) : '');
  row.push(e.activity || '');
  row.push(e.input!=null && e.input!=='' && !isNaN(parseFloat(e.input)) ? Number(formatInputDisplay(e.input)) : '');
  row.push(e.meVisit || '');
  row.push(e.amVisit || '');
  row.push(e.rmVisit || '');
  row.push(e.dsmVisit || '');
  row.push(sheetMonth);
  row.push(hasData ? 'Saved' : 'Pending');
  return row;
}

async function mirrorRowToSheet(doc, entry, month){
  try{
    const sheetName = monthToSheetTabName(month);
    const rowValues = buildSheetRowArray(doc, entry, true, month);
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'upsertRow', sheetName, row: rowValues, token: APPS_SCRIPT_SECRET }),
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return true;
  }catch(e){
    // Non-fatal: the key/value store already holds the real saved data — this is just a readable mirror.
    console.error('mirrorRowToSheet failed (data is still safely saved)', e);
    return false;
  }
}

async function mirrorRowsBatchToSheet(sheetName, rowsArray){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'upsertRows', sheetName, rows: rowsArray, token: APPS_SCRIPT_SECRET }),
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return true;
  }catch(e){
    console.error('mirrorRowsBatchToSheet failed', e);
    return false;
  }
}

async function loadMaster(){
  const raw = await storageGet('my100_master', true);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      state.master = parsed;
    }catch(e){ state.master = DEFAULT_MASTER; }
  } else {
    state.master = DEFAULT_MASTER;
  }
  const metaRaw = await storageGet('my100_master_meta', true);
  state.masterMeta = metaRaw ? JSON.parse(metaRaw) : { updatedAt:null, updatedBy:'(original upload)' };
}

async function saveMaster(newMaster, byWhom){
  const ok1 = await storageSet('my100_master', JSON.stringify(newMaster), true);
  const meta = { updatedAt: new Date().toISOString(), updatedBy: byWhom };
  const ok2 = await storageSet('my100_master_meta', JSON.stringify(meta), true);
  if(ok1 && ok2){
    state.master = newMaster;
    state.masterMeta = meta;
    return true;
  }
  return false;
}

async function loadDpWeights(){
  const raw = await storageGet('my100_dp_weights', true);
  const defaults = defaultDpWeights();
  if(raw){
    try{
      const saved = JSON.parse(raw);
      state.dpWeights = Object.assign({}, defaults, saved); // any new products added later still get a sensible default
    }catch(e){ state.dpWeights = defaults; }
  } else {
    state.dpWeights = defaults;
  }
  const metaRaw = await storageGet('my100_dp_weights_meta', true);
  state.dpWeightsMeta = metaRaw ? JSON.parse(metaRaw) : { updatedAt:null, updatedBy:'(original defaults)' };
}

async function saveDpWeights(newWeights, byWhom){
  const ok1 = await storageSet('my100_dp_weights', JSON.stringify(newWeights), true);
  const meta = { updatedAt: new Date().toISOString(), updatedBy: byWhom };
  const ok2 = await storageSet('my100_dp_weights_meta', JSON.stringify(meta), true);
  if(ok1 && ok2){
    state.dpWeights = newWeights;
    state.dpWeightsMeta = meta;
    return true;
  }
  return false;
}

async function loadEntriesForAmMonth(am, month){
  const cacheKey = am+'__'+month;
  if(state.entriesCache[cacheKey]) return state.entriesCache[cacheKey];
  const raw = await storageGet('my100_entries__'+encodeURIComponent(am)+'__'+month, true);
  const obj = raw ? JSON.parse(raw) : {};
  state.entriesCache[cacheKey] = obj;
  return obj;
}

async function saveEntriesForAmMonth(am, month, entriesObj){
  const cacheKey = am+'__'+month;
  const ok = await storageSet('my100_entries__'+encodeURIComponent(am)+'__'+month, JSON.stringify(entriesObj), true);
  if(ok){
    state.entriesCache[cacheKey] = entriesObj; // only trust the cache once the backend actually confirmed the write
  }
  return ok;
}

/* ============ COMPUTATION ============ */
function computeGroupTotal(entry, group){
  if(!entry) return 0;
  let sum = 0;
  group.items.forEach(it=>{
    const v = parseFloat(entry[it.id]);
    if(!isNaN(v)) sum += v * getDpWeight(it.id);
  });
  return sum/100000;
}
function computeTotalSupport(entry){
  if(!entry) return 0;
  let sum = 0;
  ALL_PRODUCT_ITEMS.forEach(it=>{
    const v = parseFloat(entry[it.id]);
    if(!isNaN(v)) sum += v * getDpWeight(it.id);
  });
  return sum/100000;
}
function computePatMonth(entry){
  if(!entry) return '';
  const d = parseFloat(entry.patDay), p = parseFloat(entry.pracDay);
  if(isNaN(d) || isNaN(p)) return '';
  return d*p;
}

/* Shared stats helpers (also duplicated locally inside renderKpiDashboardBody for its own scope) */
function visitStatsShared(rowsSubset, visitField){
  const withD = rowsSubset.filter(r=>r.hasData);
  const nvdCount = withD.filter(r=>r.entry[visitField]==='NVD').length;
  const visitedCount = withD.filter(r=>r.entry[visitField] && r.entry[visitField]!=='NVD').length;
  const coveragePct = rowsSubset.length ? Math.round(visitedCount/rowsSubset.length*100) : 0;
  return { nvdCount, visitedCount, coveragePct };
}
function inputStatsShared(withDataRows){
  const vals = withDataRows
    .map(r=> r.entry.input!=null && r.entry.input!=='' ? parseFloat(r.entry.input) : null)
    .filter(v=> v!=null && !isNaN(v));
  const totalInput = vals.reduce((a,b)=>a+b,0);
  const avgInput = vals.length ? totalInput/vals.length : 0;
  return { totalInput, avgInput, reportingCount: vals.length };
}
// Input is entered as a raw number (e.g. 20, 25) but always displayed divided by 100,
// per the team's reporting convention. The raw value itself is never changed in storage.
function formatInputDisplay(rawValue){
  if(rawValue==null || rawValue==='') return '';
  const v = parseFloat(rawValue);
  if(isNaN(v)) return '';
  return (v/100).toFixed(2);
}
function formatInputAgg(rawSumOrAvg){
  return (rawSumOrAvg/100).toFixed(2);
}

/* ============ ROOT RENDER ============ */
const root = document.getElementById('app');

async function boot(){
  try{
    const favicon = document.createElement('link');
    favicon.rel = 'icon';
    favicon.type = 'image/png';
    favicon.href = LOGO_DATA_URI;
    document.head.appendChild(favicon);
  }catch(e){}
  root.innerHTML = `<div class="empty" style="padding-top:80px;"><div class="big">⏳</div>Loading My100 RCPA…</div>`;
  await loadMaster();
  await loadDpWeights();
  renderLogin();
}

function retryConnection(){
  showToast('Checking connection…');
  loadMaster().then(async ()=>{
    await loadDpWeights();
    if(state.connectionOK){
      showToast('Connected ✔');
    } else {
      showToast('⚠ Still cannot reach the storage backend. Check the internet connection and try again.');
    }
    // refresh whatever is currently on screen so stale data gets replaced
    if(state.role==='am') await renderAmDashboard();
    else if(state.role==='rm') await renderRmDashboard();
    else if(state.role==='admin') await renderAdminDashboard();
    else renderLogin();
  });
}

async function refreshLiveData(){
  showToast('Refreshing live data…');
  state.entriesCache = {}; // force fresh fetch instead of using anything cached this session
  await loadMaster();
  await loadDpWeights();
  if(state.role==='am'){
    await renderAmDashboard();
  } else {
    // stays on whichever tab/filters/month the admin or RM currently has open
    await renderCompiledDashboard(state.role);
  }
  showToast('Live data refreshed ✔');
}

function saveValidationErrors(draft){
  const errs = [];
  if(!draft.practice) errs.push('Type of Practice is required.');
  if(draft.patDay===''||draft.patDay==null) errs.push('No. of Patient/day is required.');
  if(draft.pracDay===''||draft.pracDay==null) errs.push('Practice day/Mth is required.');
  const me = normalizeVisitInput(draft.meVisit);
  if(!me.valid) errs.push('ME Visit Dates is required — enter day numbers separated by commas (e.g. 05,12) or type NVD.');
  const am = normalizeVisitInput(draft.amVisit);
  if(!am.valid) errs.push('AM Visit Dates is required — enter day numbers separated by commas (e.g. 05,12) or type NVD.');
  if(draft.rmVisit){
    const rm = normalizeVisitInput(draft.rmVisit);
    if(!rm.valid) errs.push('RM Visit Dates format is invalid — use comma-separated day numbers or NVD.');
  }
  if(draft.dsmVisit){
    const dsm = normalizeVisitInput(draft.dsmVisit);
    if(!dsm.valid) errs.push('DSM Visit Dates format is invalid — use comma-separated day numbers or NVD.');
  }
  return errs;
}

async function saveCurrentEntry(){
  const doc = state.drawerDoctor;
  const draft = state.drawerDraft;
  const errBox = document.getElementById('drawerFormErr');

  const errs = saveValidationErrors(draft);
  if(errs.length){
    errBox.innerHTML = '<strong>Please fix the following before saving:</strong><br>' + errs.map(e=>'• '+escHtml(e)).join('<br>');
    errBox.style.display = 'block';
    if(typeof errBox.scrollIntoView === 'function'){
      errBox.scrollIntoView({ behavior:'smooth', block:'center' });
    }
    return;
  }
  errBox.style.display = 'none';

  // normalize visit date fields to consistent DD,DD / NVD format before saving
  const meN = normalizeVisitInput(draft.meVisit);
  const amN = normalizeVisitInput(draft.amVisit);
  const rmN = draft.rmVisit ? normalizeVisitInput(draft.rmVisit) : { valid:true, value:'' };
  const dsmN = draft.dsmVisit ? normalizeVisitInput(draft.dsmVisit) : { valid:true, value:'' };
  draft.meVisit = meN.value;
  draft.amVisit = amN.value;
  draft.rmVisit = rmN.value;
  draft.dsmVisit = dsmN.value;

  const btn = document.getElementById('saveEntryBtn');
  btn.disabled = true; btn.textContent='Saving…';
  const existing = await loadEntriesForAmMonth(state.userName, amState.month);
  const entries = Object.assign({}, existing); // copy so a failed save can't silently mutate the cache
  entries[doc.code] = Object.assign({}, draft, { updatedAt: new Date().toISOString(), updatedBy: state.userName });
  const ok = await saveEntriesForAmMonth(state.userName, amState.month, entries);
  btn.disabled = false; btn.textContent='Save';
  if(ok){
    showToast('Saved '+doc.doctor+' for '+monthLabel(amState.month));
    closeDrawer();
    const myDoctors = state.master.filter(d=>d.am===state.userName);
    renderAmShell(myDoctors, entries);
    mirrorRowToSheet(doc, entries[doc.code], amState.month); // fire-and-forget: readable Sheet mirror, non-blocking
  }
  // if save failed, storageSet already showed a toast explaining why — leave the drawer open so nothing is lost
}

/* ============ COMPILED DATA (shared by RM & Admin) ============ */
async function buildCompiledRows(doctorsList, month){
  const amsInScope = Array.from(new Set(doctorsList.map(d=>d.am)));
  const entriesByAm = {};
  // Fetch every AM's entries in parallel instead of one-at-a-time — with 13 AMs this
  // turns ~13 sequential round-trips (several seconds) into a single parallel batch.
  const results = await Promise.all(amsInScope.map(am => loadEntriesForAmMonth(am, month)));
  amsInScope.forEach((am, i) => { entriesByAm[am] = results[i]; });
  return doctorsList.map(d=>{
    const entry = (entriesByAm[d.am] || {})[d.code] || null;
    const groupTotals = {};
    PRODUCT_GROUPS.forEach(g=>{ groupTotals[g.key] = entry ? computeGroupTotal(entry, g) : 0; });
    return {
      doctor: d, entry,
      groupTotals,
      totalSupport: entry ? computeTotalSupport(entry) : 0,
      patMonth: entry ? computePatMonth(entry) : '',
      hasData: !!entry,
    };
  });
}

function compiledSummary(rows){
  const total = rows.length;
  const done = rows.filter(r=>r.hasData).length;
  const avgSupport = done ? (rows.reduce((s,r)=>s+r.totalSupport,0)/done) : 0;
  return { total, done, pending: total-done, coverage: total? Math.round(done/total*100):0, avgSupport };
}

function exportRowsToExcel(rows, monthOverride){
  const month = monthOverride || compState.month;
  const data = rows.map(r=>{
    const d=r.doctor, e=r.entry||{};
    const rec = {
      'Sr No': d.sr, 'RM Name': d.rm, 'AM Name': d.am, 'ME Name': d.me, 'Advaid No': d.code,
      'Doctor Name': d.doctor, 'Specialty': d.specialty, 'Location': d.location, 'Type of Practice': (e.practice || normalizePractice(d.practice) || d.practice),
      'No. of Patient/day': e.patDay||'', 'Practice day/Mth': e.pracDay||'', 'No. of Patient/Mth': r.patMonth,
    };
    PRODUCT_GROUPS.forEach(g=>{
      g.items.forEach(it=>{ rec[it.label] = e[it.id]!=null? e[it.id]: ''; });
      rec[g.name+' GRP'] = r.hasData? Number(r.groupTotals[g.key].toFixed(2)) : '';
    });
    rec['TOTAL SUPPORT'] = r.hasData? Number(r.totalSupport.toFixed(2)) : '';
    rec['Activity'] = e.activity||'';
    rec['Input'] = e.input!=null && e.input!=='' && !isNaN(parseFloat(e.input)) ? Number(formatInputDisplay(e.input)) : '';
    rec['ME Visit Dates'] = e.meVisit||'';
    rec['AM Visit Dates'] = e.amVisit||'';
    rec['RM Visit Dates'] = e.rmVisit||'';
    rec['DSM Visit Dates'] = e.dsmVisit||'';
    rec['Month'] = month;
    rec['Status'] = r.hasData ? 'Saved' : 'Pending';
    return rec;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'My100 RCPA');
  XLSX.writeFile(wb, 'My100_RCPA_'+month+'.xlsx');
  showToast('Excel file downloading…');
}

async function syncRowsToSheet(rows, month){
  const rowsWithData = rows.filter(r=>r.hasData);
  if(rowsWithData.length===0){
    showToast('Nothing to sync — no doctors have data for this month yet.');
    return;
  }
  const btn = document.getElementById('syncSheetBtn');
  const originalText = btn.textContent;
  btn.disabled = true;
  const sheetName = monthToSheetTabName(month);
  const BATCH_SIZE = 50;
  let ok = 0, failed = 0;
  for(let i=0; i<rowsWithData.length; i+=BATCH_SIZE){
    const batch = rowsWithData.slice(i, i+BATCH_SIZE);
    btn.textContent = `Syncing… ${Math.min(i+BATCH_SIZE, rowsWithData.length)}/${rowsWithData.length}`;
    const rowValuesBatch = batch.map(r => buildSheetRowArray(r.doctor, r.entry, true, month));
    const success = await mirrorRowsBatchToSheet(sheetName, rowValuesBatch);
    if(success) ok += batch.length; else failed += batch.length;
  }
  btn.disabled = false;
  btn.textContent = originalText;
  if(failed===0){
    showToast(`Synced ${ok} doctors to the "${sheetName}" tab ✔`);
  }else{
    showToast(`Synced ${ok} doctors — ${failed} failed. Check your connection and try again.`);
  }
}

async function renderKpiDashboardBody(){

  const rows = await buildCompiledRows(state.master, dashState.month);
  const summary = compiledSummary(rows);
  const withData = rows.filter(r=>r.hasData);

  // shared helper: visit compliance stats for a given visit field within a set of rows
  function visitStats(rowsSubset, visitField){
    const withD = rowsSubset.filter(r=>r.hasData);
    const nvdCount = withD.filter(r=>r.entry[visitField]==='NVD').length;
    const visitedCount = withD.filter(r=>r.entry[visitField] && r.entry[visitField]!=='NVD').length;
    const coveragePct = rowsSubset.length ? Math.round(visitedCount/rowsSubset.length*100) : 0;
    return { nvdCount, visitedCount, coveragePct };
  }
  // shared helper: numeric Input field totals for a set of already-hasData rows
  function inputStats(withDataRows){
    const vals = withDataRows
      .map(r=> r.entry.input!=null && r.entry.input!=='' ? parseFloat(r.entry.input) : null)
      .filter(v=> v!=null && !isNaN(v));
    const totalInput = vals.reduce((a,b)=>a+b,0);
    const avgInput = vals.length ? totalInput/vals.length : 0;
    return { totalInput, avgInput, reportingCount: vals.length };

  // RM-wise breakdown — mirrors AM-wise structure exactly, plus Total Input
  const rmList = currentRmList();

    const rmRows = rows.filter(r=>r.doctor.rm===rm);
    const s = compiledSummary(rmRows);
    const rmWithData = rmRows.filter(r=>r.hasData);
    const vs = visitStats(rmRows, 'rmVisit');
    const is = inputStats(rmWithData);
    const sumSupport = rmWithData.reduce((sum,r)=> sum + r.totalSupport, 0);
    return { rm, ...s, nvdCount: vs.nvdCount, visitCoveragePct: vs.coveragePct, sumSupport, ...is };

  // AM-wise breakdown, enriched with visit compliance + numeric Input totals
  const amList = currentAmList();

    const amRows = rows.filter(r=>r.doctor.am===am);

    const amWithData = amRows.filter(r=>r.hasData);

  `).join('');

async function saveDpRatesFromGrid(){
  const errBox = document.getElementById('dpRatesErr');
  const inputs = document.querySelectorAll('.dpRateInput');
  const newWeights = Object.assign({}, state.dpWeights);
  let hasError = false;
  inputs.forEach(inp=>{
    const v = parseFloat(inp.value);
    if(isNaN(v) || v < 0){ hasError = true; return; }
    newWeights[inp.dataset.id] = v;
  });
  if(hasError){
    errBox.textContent = 'Please enter a valid non-negative number for every DP rate.';
    errBox.style.display = 'block';
    return;
  }
  errBox.style.display = 'none';
  const btn = document.getElementById('saveDpRatesBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const ok = await saveDpWeights(newWeights, state.userName);
  btn.disabled = false; btn.textContent = 'Save DP Rates';
  if(ok){
    showToast('DP rates updated ✔ Total Support figures now use the new rates.');
    renderMasterAdminBody();
  }
  // if it failed, storageSet already showed an explanatory toast
}

          <select id="me_practice">
            <option value="">Select type…</option>
            ${PRACTICE_OPTIONS.map(o=>`<option value="${escAttr(o)}" ${normalizePractice(draft.practice)===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>

    <div class="fgroup">
      <h4>Reporting Assignment</h4>
      <div class="fgrid">
        <div class="fitem"><label>RM Name</label><input type="text" id="me_rm" value="${escAttr(draft.rm)}"/></div>
        <div class="fitem"><label>AM Name</label><input type="text" id="me_am" value="${escAttr(draft.am)}"/></div>
        <div class="fitem"><label>ME Name</label><input type="text" id="me_me" value="${escAttr(draft.me)}"/></div>
      </div>
      <p class="muted" style="margin-top:8px;">Changing RM/AM here reassigns this doctor going forward. Their entries already saved under the old AM/month stay where they are.</p>
    </div>

    <div class="fgroup">
      <h4>Baseline Patient Frequency</h4>
      <div class="fgrid">
        <div class="fitem"><label>No. of Patient/day</label><input type="number" min="0" id="me_patDay" value="${escAttr(draft.patDay)}"/></div>
        <div class="fitem"><label>Practice day/Mth</label><input type="number" min="0" id="me_pracDay" value="${escAttr(draft.pracDay)}"/></div>
      </div>
    </div>

    <div class="login-err" id="masterEditErr" style="display:none;"></div>

    <div class="drawer-actions-fixed">
      <span class="muted">Editing 1 doctor</span>
      <div class="row" style="gap:8px;">
        <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>
        <button class="btn btn-primary" id="saveMasterEditBtn">Save</button>
      </div>
    </div>
  `;
  ['doctor','code','specialty','location'].forEach(f=>{
    document.getElementById('me_'+f).addEventListener('input', e=> draft[f] = e.target.value);
  });
  document.getElementById('me_practice').addEventListener('change', e=> draft.practice = e.target.value);
  document.getElementById('me_rm').addEventListener('input', e=> draft.rm = e.target.value);
  document.getElementById('me_am').addEventListener('input', e=> draft.am = e.target.value);
  document.getElementById('me_me').addEventListener('input', e=> draft.me = e.target.value);
  document.getElementById('me_patDay').addEventListener('input', e=> draft.patDay = e.target.value);
  document.getElementById('me_pracDay').addEventListener('input', e=> draft.pracDay = e.target.value);
  document.getElementById('saveMasterEditBtn').addEventListener('click', saveMasterEditDrawer);
}

async function saveMasterEditDrawer(){
  const draft = state.masterEditDraft;
  const errBox = document.getElementById('masterEditErr');
  if(!draft.doctor || !draft.code || !draft.rm || !draft.am){
    errBox.textContent = 'Doctor Name, Advaid No, RM Name, and AM Name are all required.';
    errBox.style.display = 'block';
    return;
  }
  errBox.style.display = 'none';

  const btn = document.getElementById('saveMasterEditBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const newMaster = state.master.map(d => String(d.code)===String(draft.code) ? Object.assign({}, d, draft) : d);
  const ok = await saveMaster(newMaster, state.userName);

  btn.disabled = false; btn.textContent = 'Save';
  if(ok){
    showToast('Updated ' + draft.doctor + ' ✔');
    closeDrawer();
    state.masterEditDraft = null;
    renderMasterAdminBody();
  }
  // if it failed, storageSet already showed an explanatory toast — drawer stays open so nothing is lost
}

function downloadMasterTemplate(){
  const data = state.master.map(d=>({
    'Sr No': d.sr, 'RM Name': d.rm, 'AM Name': d.am, 'ME Name': d.me, 'Advaid No': d.code,
    'Doctor Name': d.doctor, 'Specialty': d.specialty, 'Location': d.location, 'Type of Practice': d.practice,
    'No. of Patient/day': d.patDay, 'Practice day/Mth': d.pracDay,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Master');
  XLSX.writeFile(wb, 'My100_Doctor_Master.xlsx');
  showToast('Master list downloading…');
}

function handleMasterFile(e){
  if(e.target.files[0]) parseMasterFile(e.target.files[0]);
}

let pendingMasterUpload = null;
function parseMasterFile(file){
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const wb = XLSX.read(evt.target.result, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval:'' });
      if(!json.length || !('Doctor Name' in json[0])){
        document.getElementById('uploadPreview').innerHTML = `<div class="login-err" style="display:block;">Could not find a "Doctor Name" column. Please use the downloaded template's headers.</div>`;
        return;
      }
      const parsed = json.map(row=>({
        sr: row['Sr No'], rm: String(row['RM Name']||'').trim(), am: String(row['AM Name']||'').trim(),
        me: String(row['ME Name']||'').trim(), code: row['Advaid No'], doctor: String(row['Doctor Name']||'').trim(),
        specialty: row['Specialty']||'', location: row['Location']||'', practice: row['Type of Practice']||'',
        patDay: row['No. of Patient/day']||'', pracDay: row['Practice day/Mth']||'',
      })).filter(r=>r.doctor);
      pendingMasterUpload = parsed;
      document.getElementById('uploadPreview').innerHTML = `
        <div class="panel-pad" style="padding:14px 0 0;">
          <p><strong>${parsed.length}</strong> doctor rows found. Preview of first 3:</p>
          <div class="table-scroll" style="max-height:180px;">
            <table><thead><tr><th>Sr</th><th>RM</th><th>AM</th><th>Doctor</th><th>Specialty</th><th>Location</th></tr></thead>
            <tbody>${parsed.slice(0,3).map(r=>`<tr><td>${r.sr}</td><td>${escHtml(r.rm)}</td><td>${escHtml(r.am)}</td><td>${escHtml(r.doctor)}</td><td>${escHtml(r.specialty)}</td><td>${escHtml(r.location)}</td></tr>`).join('')}</tbody></table>
          </div>
          <button class="btn btn-primary" id="confirmUploadBtn" style="margin-top:12px;">Replace master list with this file</button>
        </div>`;
      document.getElementById('confirmUploadBtn').addEventListener('click', ()=>{
        document.getElementById('confirmText').textContent = `This will replace all ${state.master.length} current doctor records with ${parsed.length} new records. This cannot be undone. Continue?`;
        document.getElementById('confirmOverlay').classList.add('open');
      });
      document.getElementById('confirmCancel').onclick = ()=> document.getElementById('confirmOverlay').classList.remove('open');
      document.getElementById('confirmOk').onclick = async ()=>{
        const okBtn = document.getElementById('confirmOk');
        okBtn.disabled = true; okBtn.textContent = 'Saving…';
        const ok = await saveMaster(pendingMasterUpload, state.userName);
        okBtn.disabled = false; okBtn.textContent = 'Yes, replace';
        document.getElementById('confirmOverlay').classList.remove('open');
        if(ok){
          showToast('Master list updated ✔');
          renderCompiledDashboard('admin');
        }
        // if it failed, storageSet already showed an explanatory toast — the upload panel stays open so you can retry
      };
    }catch(err){
      document.getElementById('uploadPreview').innerHTML = `<div class="login-err" style="display:block;">Could not read this file. Please make sure it is a valid .xlsx file.</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ============ INIT ============ */
boot();

</script>
</body>
</html>
